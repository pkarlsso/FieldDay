name: Release / iOS TestFlight

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev]
    paths: [.github/workflows/testflight.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldday-testflight-production
  cancel-in-progress: false

jobs:
  verify-expo-auth:
    name: Verify Expo authentication
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/automate-testflight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check Expo account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Missing EXPO_TOKEN repository secret.' >&2
            exit 1
          fi
          account="$(npx --yes eas-cli@27.2.0 whoami)"
          if [ "$account" != 'gogbalor' ]; then
            echo 'Expo token is not for the expected account.' >&2
            exit 1
          fi
          echo 'Expo token authenticated as the expected account.'
  build-and-submit:
    name: Build and submit iOS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build and submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Missing EXPO_TOKEN repository secret.' >&2
            exit 1
          fi
          npx --yes eas-cli@27.2.0 build --platform ios --profile production --auto-submit --non-interactive --wait
