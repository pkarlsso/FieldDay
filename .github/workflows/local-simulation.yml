name: CI / Synthetic User Simulation

on:
  pull_request:
    branches: [main, dev, codex/gorse-dev-integration]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: 30-user isolated simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      MONGODB_URI: mongodb://127.0.0.1:27017/fieldday_sim_ci
      GORSE_BASE_URL: http://127.0.0.1:8088
      GORSE_ID_SECRET: ci-only-synthetic-data
      PORT: '4000'
      SIM_API_URL: http://127.0.0.1:4000/graphql
      DISABLE_NO_SHOW_RATINGS_JOB: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start isolated Gorse
        run: |
          docker compose -f backend/docker-compose.gorse.yml up -d
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8088/api/health/ready
      - name: Run simulation against local services
        run: |
          node backend/src/index.js > "$RUNNER_TEMP/fieldday-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:4000/health
          npm run simulate:local
      - name: Show backend log on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/fieldday-backend.log" ]; then tail -100 "$RUNNER_TEMP/fieldday-backend.log"; fi
      - name: Stop isolated Gorse
        if: always()
        run: docker compose -f backend/docker-compose.gorse.yml down -v
