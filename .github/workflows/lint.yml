# .github/workflows/lint.yml
name: JS Code Linter

permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
