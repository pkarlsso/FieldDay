name: Application Build

on:
  push:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22.13
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Validate backend syntax and schema
        run: npm run check:backend
      - name: Build Expo production bundles for web, Android, and iOS
        run: npm run build
      - name: Upload application build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fieldday-bundles-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
