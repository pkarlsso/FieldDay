name: CI / Application Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: 'true'
      MONGODB_URI: mongodb://127.0.0.1:27017/fieldday
      PORT: '4000'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22.13
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Verify the standalone deployment bundle starts
        run: |
          (cd backend && zip -rq "$RUNNER_TEMP/fieldday-backend.zip" . -x '.env' 'node_modules/*')
          mkdir -p "$RUNNER_TEMP/fieldday-backend"
          unzip -q "$RUNNER_TEMP/fieldday-backend.zip" -d "$RUNNER_TEMP/fieldday-backend"
          npm ci --omit=dev --prefix "$RUNNER_TEMP/fieldday-backend"
          PORT=4001 DISABLE_NO_SHOW_RATINGS_JOB=true node "$RUNNER_TEMP/fieldday-backend/src/index.js" > "$RUNNER_TEMP/bundle.log" 2>&1 &
          bundle_pid=$!
          trap 'kill "$bundle_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:4001/health; then
            cat "$RUNNER_TEMP/bundle.log"
            exit 1
          fi
      # The session and chat tests call the running server over HTTP, so they
      # run in the same step as the server.
      - name: Start backend, verify health and run HTTP tests
        run: |
          npm run start --workspace backend > backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:4000/health
          npm run test:integration
          npm run test:chat
      # These scripts set a non-zero exit code when an assertion fails, so a
      # failing test fails the job. They clean up the records they create.
      - name: Integration tests
        run: |
          npm run test:authorization
          npm run test:profile-setup
          npm run test:session-membership
          npm run test:session-visibility
          npm run test:session-lifecycle
          npm run test:sport-preferences
          npm run test:realtime
          npm run test:cooldown
          npm run test:attendance
          npm run test:accounts

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Validate backend
            command: npm run check:backend
            artifact_path: ''
          - name: Unit tests
            command: npm run test:unit
            artifact_path: ''
          - name: Build frontend
            command: npm run build
            artifact_path: frontend/dist/
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22.13
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Run check
        run: ${{ matrix.command }}
      - name: Record build version
        if: matrix.artifact_path != ''
        id: version
        run: |
          VERSION=$(node -p "require('./frontend/app.json').expo.version")
          VERSION="$VERSION" node -e "const fs=require('fs'); fs.writeFileSync('frontend/dist/build-info.json', JSON.stringify({version: process.env.VERSION, commit: process.env.GITHUB_SHA}, null, 2) + '\\n')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Upload application build artifacts
        if: matrix.artifact_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldday-bundles-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22.13
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: npm run sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldday-sbom-${{ github.sha }}
          path: doc/SBOM.json
          if-no-files-found: error
          retention-days: 30
      - name: Open or update SBOM pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: doc/SBOM.json
          branch: automation/update-sbom
          base: dev
          commit-message: 'chore: update SBOM'
          title: 'chore: update SBOM'
          body: 'Update the generated CycloneDX SBOM for the current dev build.'
          delete-branch: true
