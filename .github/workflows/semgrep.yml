name: Semgrep
on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["main", "dev"]
  schedule:
    - cron: '20 17 * * *'  # Run daily

permissions:
  security-events: write  # Required for SARIF upload
  contents: read
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
            persist-credentials: false
      - run: semgrep ci --config=auto --sarif > semgrep.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3.37.5
        with:
          sarif_file: semgrep.sarif
        if: always()