name: Semgrep
on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["main", "dev"]
  schedule:
    - cron: '20 17 * * *'  # Run daily

permissions:
  security-events: write  # Required for SARIF upload
  contents: read
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0@sha256:d1825c2c7211b7c5469e6a3f9a1b4c8e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: semgrep ci --config=auto --sarif > semgrep.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          sarif_file: semgrep.sarif
        if: always()