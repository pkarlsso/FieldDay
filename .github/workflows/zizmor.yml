name: Zizmor
on:
  push:
    branches: ["main", "dev"]
  # No paths filter: the ruleset requires zizmor results on every PR, so this
  # must run even when a PR doesn't touch workflow files.
  pull_request:
  workflow_dispatch: {}

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
